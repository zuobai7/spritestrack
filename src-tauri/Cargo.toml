[package]
name = "spritestrack"
version = "0.1.0"
description = "SpriteStrack: open-source voxel editor for sprite-stacked and 3D game art"
authors = ["SpriteStrack contributors"]
license = "MIT"
repository = "https://github.com/zuobai7/spritestrack"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows
name = "spritestrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
